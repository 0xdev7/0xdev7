<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="232" viewBox="0 0 1200 232" fill="none">
<style>
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes flow{to{stroke-dashoffset:-20}} .flow{stroke-dasharray:6 4;animation:flow .8s linear infinite}
@keyframes act{0%,22%{stroke-opacity:1;fill-opacity:.14}30%,100%{stroke-opacity:.3;fill-opacity:.04}}
.box{stroke-opacity:.3;fill-opacity:.04;animation:act 6.0s infinite}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}} .u{opacity:0;animation:up .6s ease-out forwards}
@keyframes dot{0%{offset-distance:0%;opacity:0}5%{opacity:1}95%{opacity:1}100%{offset-distance:100%;opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/>
</linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
<path d="M32 0H0V32" stroke="#ffffff" stroke-opacity=".045"/>
</pattern>

</defs>
<rect width="1200" height="232" rx="18" fill="#0b0f1a"/><rect width="1200" height="232" rx="18" fill="url(#grid)"/><rect x=".5" y=".5" width="1199" height="231" rx="18" stroke="#1f2937"/><g class="u" style="animation-delay:0.00s">
