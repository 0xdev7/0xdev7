<text x="50.0" y="127" class="sans" font-size="12.5" fill="#94a3b8">data model</text>
</g><line class="flow" x1="232.0" y1="86.0" x2="257.0" y2="86.0" stroke="#22d3ee" stroke-width="2"/><path d="M255.0 81.0 L263.0 86.0 L255.0 91.0" stroke="#22d3ee" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="u" style="animation-delay:0.15s">
