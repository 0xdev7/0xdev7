<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="6" viewBox="0 0 1200 6" fill="none">
<style>
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/>
</linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
<path d="M32 0H0V32" stroke="#ffffff" stroke-opacity=".045"/>
</pattern>
<linearGradient id="d" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
<stop offset="0" stop-color="#22d3ee" stop-opacity=".1"/><stop offset=".25" stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset=".75" stop-color="#f472b6"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".1"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
</defs>
<rect width="1200" height="6" rx="3" fill="url(#d)"/>
</svg>
