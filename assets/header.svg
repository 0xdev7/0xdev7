<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
<style>
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}

@keyframes role{0%{opacity:0;transform:translateY(12px)}2.22%{opacity:1;transform:translateY(0)}15.00%{opacity:1;transform:translateY(0)}17.00%{opacity:0;transform:translateY(-12px)}100%{opacity:0}}
.role{opacity:0;animation:role 18.0s infinite}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 1.6s infinite}
@keyframes ring{0%{r:5;opacity:.8}100%{r:14;opacity:0}}
.ring{animation:ring 1.6s infinite}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,40px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-140px,-30px)}}
.o1{animation:drift1 14s ease-in-out infinite} .o2{animation:drift2 18s ease-in-out infinite}
@keyframes blink{50%{opacity:0}} .caret{animation:blink 1s steps(1) infinite}
@keyframes ev0{0%,5.45%{opacity:0;transform:translateX(-10px)}9.45%,92%{opacity:1;transform:none}100%{opacity:0}}.ev0{opacity:0;animation:ev0 11.0s infinite}
@keyframes ev1{0%,14.55%{opacity:0;transform:translateX(-10px)}18.55%,92%{opacity:1;transform:none}100%{opacity:0}}.ev1{opacity:0;animation:ev1 11.0s infinite}
@keyframes ev2{0%,23.64%{opacity:0;transform:translateX(-10px)}27.64%,92%{opacity:1;transform:none}100%{opacity:0}}.ev2{opacity:0;animation:ev2 11.0s infinite}
@keyframes ev3{0%,32.73%{opacity:0;transform:translateX(-10px)}36.73%,92%{opacity:1;transform:none}100%{opacity:0}}.ev3{opacity:0;animation:ev3 11.0s infinite}
@keyframes ev4{0%,41.82%{opacity:0;transform:translateX(-10px)}45.82%,92%{opacity:1;transform:none}100%{opacity:0}}.ev4{opacity:0;animation:ev4 11.0s infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-2878.2px)}} .tick{animation:tick 45s linear infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
