<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" fill="none">
<style>
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes draw{to{stroke-dashoffset:0}}
.seg{stroke-dasharray:1060;stroke-dashoffset:1060;animation:draw 3.0s cubic-bezier(.4,0,.2,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(var(--dy))}to{opacity:1;transform:none}}
.c{opacity:0;animation:up .6s ease-out forwards}
@keyframes ring{0%{r:7;opacity:.9}100%{r:22;opacity:0}} .ring{animation:ring 1.8s ease-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/>
</linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
<path d="M32 0H0V32" stroke="#ffffff" stroke-opacity=".045"/>
</pattern>
<linearGradient id="tl" x1="70" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee"/><stop offset=".3" stop-color="#8b5cf6"/><stop offset=".65" stop-color="#34d399"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
</defs>
